# Install with `pre-commit install`, see https://pre-commit.com
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff version in requirements.txt
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        exclude: ^\.(devcontainer|vscode)
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
  - repo: local
    hooks:
      # Runs from your development environment (scripts/setup), because mypy
      # needs Home Assistant and geckolib installed to check against them
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
